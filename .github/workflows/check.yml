name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv build
      - name: Check installed wheel
        run: |
          uv venv /tmp/mirror-installed
          uv pip install --python /tmp/mirror-installed/bin/python --no-deps dist/*.whl
          /tmp/mirror-installed/bin/forgejo-release-mirror --help
          /tmp/mirror-installed/bin/python -m forgejo_release_mirror --version
